name: Resultados (cada 30 min)

on:
  schedule:
    - cron: "7,37 * * * *"   # cada 30 min (GitHub puede retrasarlo)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pizarra-datos
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar resultados de ESPN
        run: python scripts/fetch_live.py
      - name: Guardar cambios
        run: |
          git config user.name "pizarra-bot"
          git config user.email "pizarra-bot@users.noreply.github.com"
          git add data/live
          git diff --cached --quiet && exit 0
          git commit -m "Resultados $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase origin main
          git push
