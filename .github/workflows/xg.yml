name: xG Understat (semanal)

on:
  schedule:
    - cron: "43 4 * * 1"   # lunes
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pizarra-datos
  cancel-in-progress: false

jobs:
  xg:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install soccerdata
      - name: Descargar xG
        run: python scripts/fetch_xg.py
      - name: Guardar
        run: |
          git config user.name "pizarra-bot"
          git config user.email "pizarra-bot@users.noreply.github.com"
          git add data/xg
          git diff --cached --quiet && exit 0
          git commit -m "xG $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
