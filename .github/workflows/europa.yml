name: Europa (Champions, Europa y Conference)

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pizarra-datos
  cancel-in-progress: false

jobs:
  europa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_europa.py
      - run: |
          git config user.name "pizarra-bot"
          git config user.email "pizarra-bot@users.noreply.github.com"
          git add data/europa
          git diff --cached --quiet && exit 0
          git commit -m "Europa $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase origin main
          git push
